<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>MK1300 V2 modifier fix</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:system-ui,sans-serif;background:#10131a;color:#e8ecf4;max-width:720px;margin:26px auto;padding:0 16px;line-height:1.5}
.box{background:#1a1f2b;border:1px solid #2c3446;border-radius:10px;padding:16px;margin:14px 0}
button{font-size:17px;padding:11px 20px;border:0;border-radius:8px;background:#7f6cff;color:#fff;cursor:pointer;margin:4px 8px 4px 0}
button:disabled{opacity:.4;cursor:default}
textarea{width:100%;height:260px;background:#0b0e14;color:#9dffb8;border:1px solid #2c3446;border-radius:8px;padding:10px;font-family:monospace;font-size:13px;box-sizing:border-box}
</style></head><body>
<h1>MK1300 V2 modifier key fix</h1>
<div class="box">
<p>Fixes <b>Left Shift, Right Shift, Left Ctrl, Windows and Left Alt</b>. It writes 5 keys one time, then reads them back.</p>
<p>Use Chrome or Edge. Click the button <b>once</b> and wait for "Done".</p>
<button id="go">Fix modifier keys</button><button id="copy">Copy log</button>
</div>
<textarea id="out" readonly></textarea>
<script>
const FIX=[[45,"Left Shift",0x02],[58,"Right Shift",0x20],[60,"Left Ctrl",0x01],[61,"Windows",0x08],[62,"Left Alt",0x04]];
const LAYER=0;
const out=document.querySelector("#out"),go=document.querySelector("#go");
const log=m=>{out.value+=m+"\n";out.scrollTop=out.scrollHeight};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let dev=null;
document.querySelector("#copy").onclick=async()=>{try{await navigator.clipboard.writeText(out.value)}catch(e){out.select();document.execCommand("copy")}};
function xfer(p){return new Promise(async(res,rej)=>{
  const r=new Uint8Array(64);r[0]=6;p.forEach((v,i)=>{r[1+i]=v});let done=false;
  const h=e=>{if(done)return;done=true;dev.removeEventListener("inputreport",h);res(new Uint8Array(e.data.buffer))};
  dev.addEventListener("inputreport",h);
  try{await dev.sendReport(0,r)}catch(err){dev.removeEventListener("inputreport",h);return rej(err)}
  setTimeout(()=>{if(!done){done=true;dev.removeEventListener("inputreport",h);rej(new Error("no reply"))}},1500);
});}
async function readAll(){
  const d=new Uint8Array(320);
  for(let e=0;e<6;e++){const off=56*e;const rep=await xfer([8,58,off&255,off>>8&255,0,LAYER]);
    for(let i=0;i<56&&off+i<d.length;i++)d[off+i]=rep[8+i]||0;}
  return d;
}
go.onclick=async()=>{
  out.value="";go.disabled=true;
  try{
    if(!navigator.hid)throw new Error("Use Chrome or Edge");
    const d=await navigator.hid.requestDevice({filters:[{vendorId:0x36AE,usagePage:0xFF00,usage:0x02}]});
    if(!d.length)throw new Error("No device selected");
    dev=d[0];if(!dev.opened)await dev.open();
    let data=await readAll();
    const dk=Array.from(data.slice(4*33,4*33+4));
    if(dk.join()!=="32,0,7,0")throw new Error("Safety check failed (D key reads "+dk.join(",")+"). Not writing.");
    for(const [idx,name,mask] of FIX){
      log(name+" before: "+Array.from(data.slice(4*idx,4*idx+4)).join(","));
      const off=4*idx;
      await xfer([16,7,off&255,off>>8&255,0,LAYER,0,32,mask,0,0]);
      await sleep(100);
    }
    data=await readAll();
    let ok=true;
    for(const [idx,name,mask] of FIX){
      const f=Array.from(data.slice(4*idx,4*idx+4));
      const good=f.join()==[32,mask,0,0].join();ok=ok&&good;
      log(name+" after: "+f.join(",")+(good?"  OK":"  WRONG"));
    }
    log(ok?"\nDone. UNPLUG the keyboard, wait 5 s, plug it back in, and test.":"\nSome keys did not take. Copy log and send it to Claude.");
    try{await dev.close()}catch(e){}
  }catch(e){log("ERROR: "+e.message)}
  go.disabled=false;
};
</script></body></html>
