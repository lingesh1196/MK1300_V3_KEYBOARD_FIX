<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>MK1300 V2 compare copies</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:system-ui,sans-serif;background:#10131a;color:#e8ecf4;max-width:820px;margin:26px auto;padding:0 16px;line-height:1.5}
.box{background:#1a1f2b;border:1px solid #2c3446;border-radius:10px;padding:16px;margin:14px 0}
button{font-size:17px;padding:11px 20px;border:0;border-radius:8px;background:#7f6cff;color:#fff;cursor:pointer;margin:4px 8px 4px 0}
textarea{width:100%;height:420px;background:#0b0e14;color:#9dffb8;border:1px solid #2c3446;border-radius:8px;padding:10px;font-family:monospace;font-size:12px;box-sizing:border-box}
</style></head><body>
<h1>Compare the two key copies (read only)</h1>
<div class="box"><p>Lists every key that is wrong in the stored copy, the live copy, or differs between them. <b>Writes nothing.</b> Close the official software first. Use Chrome or Edge.</p>
<button id="go">Connect and compare</button><button id="copy">Copy log</button></div>
<textarea id="out" readonly></textarea>
<script>
const KEYS=[[0, "Esc", 32, 41], [1, "1", 32, 30], [2, "2", 32, 31], [3, "3", 32, 32], [4, "4", 32, 33], [5, "5", 32, 34], [6, "6", 32, 35], [7, "7", 32, 36], [8, "8", 32, 37], [9, "9", 32, 38], [10, "0", 32, 39], [11, "?\n* \\", 32, 45], [12, "_\n- ", 32, 46], [13, "Back", 32, 42], [15, "Tab", 32, 43], [16, "Q", 32, 20], [17, "W", 32, 26], [18, "E", 32, 8], [19, "R", 32, 21], [20, "T", 32, 23], [21, "Y", 32, 28], [22, "U", 32, 24], [23, "I", 32, 12], [24, "O", 32, 18], [25, "P", 32, 19], [26, "[  {", 32, 47], [27, "}  ]", 32, 48], [28, "\\", 32, 49], [30, "Caps", 32, 57], [31, "A", 32, 4], [32, "S", 32, 22], [33, "D", 32, 7], [34, "F", 32, 9], [35, "G", 32, 10], [36, "H", 32, 11], [37, "J", 32, 13], [38, "K", 32, 14], [39, "L", 32, 15], [40, ";", 32, 51], [41, "'", 32, 52], [43, "Enter", 32, 40], [45, "Shift", 32, 225], [47, "Z", 32, 29], [48, "X", 32, 27], [49, "C", 32, 6], [50, "V", 32, 25], [51, "B", 32, 5], [52, "N", 32, 17], [53, "M", 32, 16], [54, ",  <", 32, 54], [55, ".  >", 32, 55], [56, "/  ?", 32, 56], [58, "Shift", 32, 229], [60, "Ctrl", 32, 256], [61, "Win", 32, 2048], [62, "Alt", 32, 1024], [66, "Space", 32, 44], [70, "Alt Gr", 32, 230], [71, "Fn", 32, 255], [72, "Lighting", 31, 3], [73, "Ctrl", 32, 228]];
const out=document.querySelector("#out"),log=m=>{out.value+=m+"\n"};
let dev=null;
document.querySelector("#copy").onclick=async()=>{try{await navigator.clipboard.writeText(out.value)}catch(e){out.select();document.execCommand("copy")}};
function xfer(p){return new Promise(async(res,rej)=>{
  const r=new Uint8Array(64);r[0]=6;p.forEach((v,i)=>{r[1+i]=v});let done=false;
  const h=e=>{if(done)return;done=true;dev.removeEventListener("inputreport",h);res(new Uint8Array(e.data.buffer))};
  dev.addEventListener("inputreport",h);
  try{await dev.sendReport(0,r)}catch(err){dev.removeEventListener("inputreport",h);return rej(err)}
  setTimeout(()=>{if(!done){done=true;dev.removeEventListener("inputreport",h);rej(new Error("no reply"))}},1500);
});}
const S=a=>Array.from(a).join(",");
const nm=i=>{const k=KEYS.find(k=>k[0]==i);return k?k[1].replace(/\n/g," "):"(no key)"};
document.querySelector("#go").onclick=async()=>{
  out.value="";
  try{
    if(!navigator.hid)throw new Error("Use Chrome or Edge");
    const d=await navigator.hid.requestDevice({filters:[{vendorId:0x36AE,usagePage:0xFF00,usage:0x02}]});
    if(!d.length)throw new Error("No device selected");
    dev=d[0];if(!dev.opened)await dev.open();
    const buf=new Uint8Array(56*15);
    for(let c=0;c<15;c++){const off=56*c;const rep=await xfer([19,58,off&255,off>>8&255]);for(let i=0;i<56;i++)buf[off+i]=rep[8+i]||0}
    const live=new Uint8Array(320);
    for(let e=0;e<6;e++){const off=56*e;const rep=await xfer([8,58,off&255,off>>8&255,0,0]);for(let i=0;i<56&&off+i<live.length;i++)live[off+i]=rep[8+i]||0}
    let nDiff=0,nA=0,nB=0,nL=0;
    log("Slot  Key        Stored(A)      Live(B)        Official read   Problem");
    for(let i=0;i<75;i++){
      const a=buf.slice(228+4*i,232+4*i),b=buf.slice(528+4*i,532+4*i),l=live.slice(4*i,4*i+4);
      const k=KEYS.find(k=>k[0]==i);
      let prob=[];
      if(S(a)!==S(b))prob.push("A differs from B");
      if(S(b)!==S(l))prob.push("B differs from official read");
      if(k&&k[2]==32&&k[3]>=4&&k[3]<=101){const ex=[32,0,k[3],0].join(",");if(S(a)!==ex)prob.push("A not normal");if(S(b)!==ex)prob.push("B not normal")}
      if(prob.length){log(String(i).padEnd(5)+" "+nm(i).padEnd(10)+" "+S(a).padEnd(14)+" "+S(b).padEnd(14)+" "+S(l).padEnd(14)+"  "+prob.join("; "))}
    }
    log("\n(only slots with a problem are listed; unused slots with junk are expected and harmless)");
    log("Done. Copy log and paste it to Claude.");
    try{await dev.close()}catch(e){}
  }catch(e){log("ERROR: "+e.message)}
};
</script></body></html>
